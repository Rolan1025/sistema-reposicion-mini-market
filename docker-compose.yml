services:
  dashboard:
    build: .
    container_name: mini_market_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app/src

  api:
    build: .
    container_name: mini_market_api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - PYTHONPATH=/app/src

  n8n:
    image: n8nio/n8n:1.69.2
    container_name: mini_market_n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n/.n8n:/home/node/.n8n
      - ./:/workspace
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Bogota

